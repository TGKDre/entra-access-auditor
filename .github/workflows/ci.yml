name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Smoke run on sample data
        run: python -m entra_auditor.cli --input data/sample/users.json --out reports
        env:
          PYTHONPATH: src
